[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
dynamic = ["version"]
description = "ARGUS - Network Attack Surface Mapper. See everything. Miss nothing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Samson Roi"}]
keywords = ["nmap", "network", "security", "attack surface", "asset inventory", "risk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "rich>=13.0",
    "python-nmap>=0.7.1",
    "jinja2>=3.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/SamsonRoi/ARGUS"
Changelog = "https://github.com/SamsonRoi/ARGUS/blob/main/CHANGELOG.md"
Issues = "https://github.com/SamsonRoi/ARGUS/issues"

[project.scripts]
argus = "argus.main:main"

[project.optional-dependencies]
pdf = [
    "reportlab>=4.0",
]
dev = [
    "pytest>=7.0",
    "jsonschema>=4.0",
    "reportlab>=4.0",
]

[tool.setuptools.dynamic]
version = {attr = "argus.__version__"}

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.setuptools.package-data]
"argus.data" = ["*.toml", "*.json"]
"argus.reports" = ["templates/*.j2"]