[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "ARGUS - Network Attack Surface Mapper. See everything. Miss nothing."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "rich>=13.0",
]

[project.scripts]
argus = "argus.main:main"

[tool.setuptools.packages.find]
include = ["argus*"]


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]