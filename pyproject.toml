[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "ARGUS - Network Attack Surface Mapper. See everything. Miss nothing."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "rich>=13.0",
    "python-nmap>=0.7.1",
    "jinja2>=3.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
argus = "argus.main:main"

[project.optional-dependencies]
pdf = [
    "reportlab>=4.0",
]
dev = [
    "pytest>=7.0",
    "jsonschema>=4.0",
    "reportlab>=4.0",
]

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.setuptools.package-data]
"argus.data" = ["*.toml", "*.json"]
"argus.reports" = ["templates/*.j2"]