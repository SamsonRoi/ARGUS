# ARGUS asset classification rules
#
# Each [[role]] describes one kind of device or service. Each [[role.signal]]
# is one clue, with a weight. A host's score for a role is the sum of the
# weights of the clues that match it, kept between 0 and 100:
#
#   70 or more -> high confidence
#   40 to 69   -> medium confidence
#   20 to 39   -> low confidence ("possible")
#   below 20   -> not shown
#
# A clue has exactly ONE of these tests:
#
#   tcp_any        any of these TCP ports is open
#   tcp_all        all of these TCP ports are open
#   udp_any        any of these UDP ports is open (open|filtered does not count)
#   service_any    a port's service name contains one of these words
#   product_any    a port's product or version text contains one of these words
#   vendor_any     the MAC vendor contains one of these words
#   os_any         the OS estimate contains one of these words
#   hostname_any   the hostname contains one of these words
#   ip_last_octet  the address ends in one of these numbers (IPv4 only)
#   gateway        true: the host was the first hop in a traceroute
#   no_open_ports  true: no open ports were found
#
# Optional: "note" adds a short explanation to the evidence, and a negative
# weight counts against the role. Word matches ignore upper/lower case.
#
# Increase `version` whenever the rules change, so saved scans record which
# rules labelled them.

version = 1

# ----------------------------------------------------------------------
[[role]]
key = "router"
label = "Router or gateway"
criticality = "high"

  [[role.signal]]
  gateway = true
  weight = 55
  note = "traffic to other hosts passes through it"

  [[role.signal]]
  vendor_any = ["Cisco", "Juniper", "MikroTik", "Routerboard", "Ubiquiti", "TP-Link", "Netgear", "Fortinet", "Palo Alto", "Aruba", "Zyxel", "D-Link", "Huawei Technologies", "ASUSTek", "Linksys", "SonicWall", "Sophos", "WatchGuard", "Arcadyan", "Technicolor", "Sagemcom"]
  weight = 35
  note = "networking equipment maker"

  [[role.signal]]
  os_any = ["RouterOS", "Cisco IOS", "IOS XE", "JunOS", "FortiOS", "PAN-OS", "OpenWrt", "DD-WRT", "pfSense", "OPNsense", "EdgeOS", "VyOS"]
  weight = 45

  [[role.signal]]
  product_any = ["MikroTik", "RouterOS", "Cisco IOS", "dnsmasq", "MiniUPnP", "lighttpd/ubnt", "Boa HTTPd", "GoAhead"]
  weight = 25

  [[role.signal]]
  tcp_any = [179]
  weight = 30
  note = "BGP routing"

  [[role.signal]]
  ip_last_octet = [1, 254]
  weight = 15
  note = "an address commonly given to gateways"

  [[role.signal]]
  udp_any = [161]
  weight = 10
  note = "SNMP management"

