name: tests

# Runs the test suite on the oldest and newest supported Python versions,
# so code that only works on newer Python is caught before it reaches anyone.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Nmap
        run: sudo apt-get update && sudo apt-get install -y nmap poppler-utils

      - name: Install ARGUS
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: python -m pytest -q
