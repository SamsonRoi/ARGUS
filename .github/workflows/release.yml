name: release

# Push a version tag (for example: git tag v1.0.0 && git push origin v1.0.0)
# and this workflow tests ARGUS, builds it, and publishes a GitHub release
# with the notes from CHANGELOG.md and the installable files attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Nmap
        run: sudo apt-get update && sudo apt-get install -y nmap poppler-utils
      - name: Install ARGUS
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: python -m pytest -q

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the tag matches the version in the code
        run: |
          VERSION=$(python -c "import argus; print(argus.__version__)")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match argus.__version__ ($VERSION)"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
          cd dist && sha256sum * > SHA256SUMS

      - name: Take the release notes from CHANGELOG.md
        run: |
          python - <<'PY'
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[)", text, re.S | re.M)
          notes = match.group(1).strip() if match else f"ARGUS {version}"
          open("release-notes.md", "w", encoding="utf-8").write(notes + "\n")
          PY

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: ARGUS ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
